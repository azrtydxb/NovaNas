name: e2e

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zfs-e2e:
    # disabled: needs a ZFS-capable host; no runner in the fleet exposes /dev/zfs
    if: false
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: ZFS sanity
        run: |
          zfs --version
          zpool --version
          test -e /dev/zfs
      - name: Run e2e tests
        run: sudo -E go test -tags=e2e -timeout=10m ./test/e2e/...
