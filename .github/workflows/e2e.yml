name: e2e

on:
  # e2e is a full-tier job: never on PRs. Nightly + manual only, matching
  # the org three-tier model. The job stays disabled until a runner with
  # /dev/zfs exists.
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zfs-e2e:
    # disabled: needs a ZFS-capable host; no runner in the fleet exposes /dev/zfs
    if: false
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: ZFS sanity
        run: |
          zfs --version
          zpool --version
          test -e /dev/zfs
      - name: Run e2e tests
        run: sudo -E go test -tags=e2e -timeout=10m ./test/e2e/...
