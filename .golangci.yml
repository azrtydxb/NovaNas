version: "2"
run:
  timeout: 10m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - misspell
  settings:
    revive:
      rules:
        - name: exported
    misspell:
      # `exportfs` is the Linux NFS exportfs(8) utility, not a misspelling of
      # "exports"; the linter flags the literal command name used by the NFS
      # handler.
      ignore-rules:
        - exportfs
    gosec:
      # These rules flag deliberate design decisions rather than defects:
      # G304 file paths come from trusted operator config / API input,
      # G301 directory modes are chosen on purpose for shared data dirs,
      # G204 system tools are invoked with validated arguments,
      # G101 matches constant *names* (e.g. "credentialStore") not secrets,
      # G404 uses math/rand only for retry-backoff jitter, never for
      # cryptographic material, and the G70x taint rules (incl. G702 command
      # injection) are experimental and report false positives on inputs that
      # are validated before use.
      excludes:
        - G101
        - G204
        - G301
        - G304
        - G404
        - G702
        - G703
        - G704
        - G705
        - G710
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      # revive's `exported` rule requires a doc comment on every exported
      # identifier. The project already has ~280 exported symbols (including
      # large constant enum blocks) without doc comments; documenting them all
      # is a separate, documentation-only effort, so this rule's findings are
      # excluded here to keep the change focused on real correctness issues.
      - linters:
          - revive
        text: "^exported: "
formatters:
  enable:
    - gofmt
    - goimports
